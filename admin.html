<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grand Duchy of Vidland · Chancellery Central Authority</title>
<link rel="icon" type="image/svg+xml" href="icons/admin.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/admin-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/admin-180.png">
<link rel="manifest" href="icons/manifest-admin.json">
<meta name="theme-color" content="#0a1b2e">
<meta name="apple-mobile-web-app-title" content="中央登记">
<meta name="application-name" content="中央登记">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="vidland.css">
<script src="vidland-audit.js"></script>
<script src="vidland-store.js"></script>
<script src="vidland-i18n.js"></script>
<script src="vidland-core.js"></script>
<style>
  .statgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:20px}
  @media(max-width:1100px){.statgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:620px){.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .stat{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--navy);padding:14px 15px}
  .stat .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-family:var(--serif);font-size:28px;color:var(--navy);line-height:1.25;margin-top:4px}
  .stat .s{font-size:10px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
  .decision-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .reason-box{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .reason-box label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--slate);font-weight:600;display:block;margin-bottom:5px}
  .reason-box textarea{width:100%;min-height:70px;padding:9px 11px;border:1px solid var(--line-2);border-radius:2px;resize:vertical;font-size:13px}
  .bio-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .bio-strip img{width:88px;height:110px;object-fit:cover;border:1px solid var(--line-2)}
  .grade-pick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .app-detail{background:#fff;border:1px solid var(--line);padding:14px;max-height:46vh;overflow:auto}
  .app-detail .kv{font-size:12px}
  .leap-levels{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .sysline{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .sysline .k{color:var(--slate);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
  .sysline .v{font-family:var(--mono);font-size:11.5px;word-break:break-all;text-align:right;max-width:70%}
  .pane-title{font-family:var(--serif);font-size:21px;color:var(--navy)}
</style>
</head>
<body>
<div id="masthead"></div>
<div id="subbar"></div>
<div class="wrap">
  <div class="hero">
    <div class="eyebrow" id="hero-eyebrow"></div>
    <h1 id="hero-title"></h1>
    <div class="lead" id="hero-lead"></div>
    <div class="small" style="margin-top:12px;color:var(--green);font-weight:600">◈ <span id="hero-session"></span></div>
    <div class="watermark">VIDLAND</div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="pane"><div class="empty">…</div></div>
</div>
<div id="footer"></div>

<script>
(function () {
  'use strict';
  var V = window.Vidland, t = V.t, esc = V.esc, fmt = V.fmt;

  /* ==========================================================
     THE MASTER KEY no longer ships with this page.
     It was moved into the loopback audit vault (DPAPI-sealed on this
     machine). This terminal POSTs the sealed envelope to the server and
     receives ONLY plaintext business data back. A phone running this page
     therefore holds no private key, no vault key and no token string —
     while every Authority function stays available.
     ========================================================== */
  V.registerAuthorityOpener(async function (env) {
    var r = await fetch('/api/vault/open', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ envelope: env })
    });
    var j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || 'OPEN_DENIED');
    return j.plain;
  });

  /* Inspection protocols are shipped EMPTY by statute.
     Every step and its content is authored, stored and promulgated
     exclusively by the Chancellery Central Authority. No template,
     preset item or suggested wording is delivered with the system. */

  /* ---------- state ---------- */
  var TABS = [
    ['overview','m.tab.overview'],['subjects','m.tab.subjects'],['apps','m.tab.apps'],
    ['protocol','m.tab.protocol'],['inspections','m.tab.inspections'],['certs','m.tab.certs'],
    ['leap','m.tab.leap'],['ledger','m.tab.ledger'],['system','m.tab.system']
  ];
  var active = 'overview';
  var protoLevel = 'R', protoLang = 'en';
  var protoDraft = null;
  var _seq = 0;
  var lastState = null;

  function getProto(s) {
    if (!protoDraft) {
      protoDraft = {};
      ['R','Z','A','M'].forEach(function (lv) {
        protoDraft[lv] = (s.protocol[lv] || []).map(function (x) {
          return { id: x.id || V.uid('STP'), title: Object.assign({}, x.title), detail: Object.assign({}, x.detail) };
        });
      });
    }
    return protoDraft;
  }

  var UI = V.init('admin', function () { render(); });

  async function render() {
    var my = ++_seq;
    var s;
    try { s = await V.Vault.state(); } catch (e) { s = V.Vault.blankState(); }
    if (my !== _seq) return;
    lastState = s;
    /* A silent auto-save must not rebuild the DOM under an active caret. */
    if (syncSuspend) return;
    document.getElementById('hero-eyebrow').textContent = t('m.hero.eyebrow');
    document.getElementById('hero-title').textContent = t('m.hero.title');
    document.getElementById('hero-lead').textContent = t('m.hero.lead');
    document.getElementById('hero-session').textContent = t('m.session') + '  ·  ' + t('m.common.realtime');
    var pending = s.applications.filter(function (a) { return a.status === 'LODGED'; }).length;
    document.getElementById('tabs').innerHTML = TABS.map(function (x) {
      var cnt = x[0] === 'apps' && pending ? '<span class="count">' + pending + '</span>' : '';
      return '<button data-tab="' + x[0] + '" class="' + (active === x[0] ? 'on' : '') + '">' + esc(t(x[1])) + cnt + '</button>';
    }).join('');
    var pane = document.getElementById('pane');
    pane.innerHTML = ({
      overview: paneOverview, subjects: paneSubjects, apps: paneApps,
      protocol: paneProtocol, inspections: paneInspections, certs: paneCerts,
      leap: paneLeap, ledger: paneLedger, system: paneSystem
    })[active](s);
    if (syncStatusText) {
      var box = document.getElementById('proto-sync');
      if (box) box.textContent = syncStatusText;
    }
  }

  /* ---------- panes ---------- */
  function paneOverview(s) {
    var pendingApps = s.applications.filter(function (a) { return a.status === 'LODGED'; });
    var awaitingM = s.certificates.filter(function (c) { return c.status === 'AWAITING_GRADE'; }).length;
    var stats = [
      ['m.ov.subjects', Object.keys(s.subjects).length, 'g.sealed'],
      ['m.ov.petitions', s.applications.length, 's.lodged'],
      ['m.ov.awaiting', pendingApps.length, 's.pending'],
      ['m.ov.inspections', s.inspections.length, 's.completed'],
      ['m.ov.instruments', s.certificates.length, 's.issued'],
      ['m.ov.relay', V.Vault.inbox().filter(function (e) { return !s.processed[e.id]; }).length, 'g.secure']
    ];
    var h = '<div class="doc"><div class="doc-head"><div><div class="kicker">' + esc(t('g.authorityShort')) +
      '</div><h2>' + esc(t('m.ov.title')) + '</h2></div><span class="badge ok">' + esc(t('m.common.realtime')) + '</span></div><div class="doc-body">';
    h += '<div class="statgrid">' + stats.map(function (x) {
      return '<div class="stat"><div class="k">' + esc(t(x[0])) + '</div><div class="v">' + x[1] + '</div><div class="s">' + esc(t(x[2])) + '</div></div>';
    }).join('') + '</div>';
    h += '<div class="notice good"><span class="ttl">' + esc(t('m.ov.relayOk')) + '</span>' + esc(t('m.ov.relayNote')) + '</div>';
    h += '<h3 class="pane-title" style="margin:22px 0 10px">' + esc(t('m.ov.queue')) + '</h3>';
    if (!pendingApps.length) h += '<div class="empty">' + esc(t('m.common.none')) + '</div>';
    else {
      h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + esc(t('m.app.col.id')) + '</th><th>' + esc(t('m.app.col.stage')) +
        '</th><th>' + esc(t('m.app.col.ref')) + '</th><th>' + esc(t('m.app.col.lodged')) + '</th><th>' + esc(t('m.app.col.act')) + '</th></tr></thead><tbody>';
      pendingApps.forEach(function (a) {
        h += '<tr><td class="mono">' + esc(a.id) + '</td><td>' + esc(t('st.' + a.stage + '.name')) + ' · ' + esc(t('p.form.round' + (a.round === 2 ? '2' : '1'))) +
          '</td><td class="mono">' + esc(a.ref) + '</td><td class="mono">' + esc(fmt(a.lodgedAt)) + '</td>' +
          '<td class="act"><button class="btn sm" data-act="adj" data-id="' + esc(a.id) + '">' + esc(t('m.common.confirm')) + '</button></td></tr>';
      });
      h += '</tbody></table></div>';
    }
    if (awaitingM) h += '<div class="notice warn mt"><span class="ttl">' + esc(t('s.awaitingGrade')) + '</span>' + esc(t('m.insp.gradeNote')) + ' (' + awaitingM + ')</div>';
    h += '</div><div class="doc-foot"><span>' + esc(t('x.sealed')) + '</span><span class="docnum">REG / ' + esc(fmt(s.createdAt)) + '</span></div></div>';
    return h;
  }

  function paneSubjects(s) {
    var rows = Object.keys(s.subjects).map(function (k) { return s.subjects[k]; });
    var h = '<div class="doc"><div class="doc-head"><div><div class="kicker">' + esc(t('g.restricted')) + '</div><h2>' + esc(t('m.sub.title')) +
      '</h2><div class="sub">' + esc(t('m.sub.sub')) + '</div></div>' +
      '<button class="btn" data-act="sub-create">' + esc(t('m.sub.create')) + '</button></div><div class="doc-body">';
    if (!rows.length) h += '<div class="empty"><span class="big">§</span>' + esc(t('m.sub.empty')) + '</div>';
    else {
      h += '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        ['m.sub.col.ref','m.sub.col.name','m.sub.col.nat','m.sub.col.status','m.sub.col.code','m.sub.col.nid','m.sub.col.act']
          .map(function (k) { return '<th>' + esc(t(k)) + '</th>'; }).join('') + '</tr></thead><tbody>';
      rows.forEach(function (x) {
        h += '<tr><td class="mono">' + esc(x.ref) + '</td><td>' + esc(x.identity.name || [x.identity.surname, x.identity.given].filter(Boolean).join(' ') || '—') +
          '</td><td>' + esc(x.identity.nationality || '—') + '</td><td>' + statusBadge(x.credential) +
          '</td><td class="mono">' + esc(x.credentialCode || '—') + '</td><td class="mono">' + esc(x.nationalId || '—') + '</td>' +
          '<td class="act"><button class="btn sm secondary" data-act="sub-edit" data-id="' + esc(x.ref) + '">' + esc(t('a.edit')) + '</button> ' +
          '<button class="btn sm danger" data-act="sub-del" data-id="' + esc(x.ref) + '">' + esc(t('a.delete')) + '</button></td></tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '</div><div class="doc-foot"><span>' + esc(t('m.common.realtime')) + '</span><span class="docnum">' + rows.length + ' REC</span></div></div>';
    return h;
  }

  function statusBadge(c) {
    var map = { NONE:'neutral', C:'info', D:'info', TR:'pending', PR:'ok', CITIZEN:'excellent' };
    var key = c === 'NONE' ? 's.none' : c === 'CITIZEN' ? 's.citizen' : 'cr.' + c;
    return '<span class="badge ' + (map[c] || 'neutral') + '">' + esc(t(key)) + '</span>';
  }

  function paneApps(s) {
    var apps = s.applications.slice().sort(function (a, b) { return b.lodgedAt - a.lodgedAt; });
    var h = '<div class="doc"><div class="doc-head"><div><div class="kicker">' + esc(t('g.restricted')) + '</div><h2>' + esc(t('m.app.title')) +
      '</h2><div class="sub">' + esc(t('m.app.sub')) + '</div></div>' +
      '<span class="badge info">' + esc(t('m.app.sealedNote')) + '</span></div><div class="doc-body">';
    if (!apps.length) h += '<div class="empty"><span class="big">§</span>' + esc(t('m.app.empty')) + '</div>';
    else {
      h += '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        ['m.app.col.id','m.app.col.stage','m.app.col.round','m.app.col.ref','m.app.col.lodged','m.app.col.state','m.app.col.act']
          .map(function (k) { return '<th>' + esc(t(k)) + '</th>'; }).join('') + '</tr></thead><tbody>';
      apps.forEach(function (a) {
        var st = a.status;
        var bk = st === 'LODGED' ? 'pending' : st === 'APPROVED' ? 'ok' : st === 'REJECTED' ? 'bad' : 'info';
        h += '<tr><td class="mono">' + esc(a.id) + '</td><td>' + esc(t('st.' + a.stage + '.name')) +
          '</td><td class="mono">' + a.round + '</td><td class="mono">' + esc(a.ref) + '</td><td class="mono">' + esc(fmt(a.lodgedAt)) +
          '</td><td><span class="badge ' + bk + '">' + esc(appStatus(st)) + '</span></td>' +
          '<td class="act"><button class="btn sm secondary" data-act="adj" data-id="' + esc(a.id) + '">' + esc(t('a.view')) + '</button></td></tr>';
        if (a.reason) h += '<tr><td colspan="7" style="background:#fdf3f1;color:var(--red)">' + esc(t('a.reason')) + ': ' + esc(a.reason) + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '</div><div class="doc-foot"><span>' + esc(t('x.sealed')) + '</span><span class="docnum">' + apps.length + ' PET</span></div></div>';
    return h;
  }
  function appStatus(st) {
    return t({ LODGED:'s.lodged', PREAPPROVED:'s.preapproved', APPROVED:'s.approved',
      REJECTED:'s.rejected', WAITLISTED:'s.waitlisted' }[st] || 's.unknown');
  }

  /* ---- Two-way live sync between protocols/*.txt and the sealed register.
     The server owns the plaintext files; this page owns the cipher key.
     Every write to the register still goes through Vault.mutate(). ------ */
  var syncRev = null;          // last file fingerprint we know about
  var syncBusy = false;        // a poll/pull is in flight
  var pushBusy = false;        // a push is in flight (independent of polling)
  var syncSuspend = false;     // suppress re-render while the user is typing
  var syncDeferred = false;    // an unresolved conflict; wait for manual refresh
  var pushTimer = null;
  var syncStatusText = '';     // survives async re-renders

  function editingNow() {
    var el = document.activeElement;
    return !!(el && el.dataset && el.dataset.pfield);
  }

  function syncStatus(text, kind) {
    syncStatusText = text;
    var box = document.getElementById('proto-sync');
    if (box) {
      box.textContent = text;
      box.className = 'small mb ' + (kind || 'muted');
    }
  }

  async function fetchDrafts() {
    var r = await fetch('api/protocols', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  function normaliseLevels(levels) {
    var out = {};
    ['R','Z','A','M'].forEach(function (lv) {
      out[lv] = (levels[lv] || []).map(function (x) {
        return {
          id: V.uid('STP'),
          title: Object.assign({}, x.title),
          detail: Object.assign({}, x.detail)
        };
      });
    });
    return out;
  }

  /* File -> register. Silent by default (startup / poll). */
  async function pullDrafts(data, quiet) {
    if (!data || !data.levels) return false;
    var levels = normaliseLevels(data.levels);
    var defined = data.defined || Object.keys(levels).filter(function (lv) {
      return (data.levels[lv] || []).length;
    });
    if (!defined.length) return false;
    var snapshot = JSON.parse(JSON.stringify(levels));
    await V.Vault.mutate(function (s) {
      defined.forEach(function (lv) { s.protocol[lv] = snapshot[lv]; });
      V.Vault.ledger(s, 'AUTHORITY', 'm.proto.import.ledger');
    });
    protoDraft = null;
    syncRev = data.rev;
    if (!quiet) V.toast(t('m.proto.sync.pulled'), 'good');
    return true;
  }

  /* Register -> file. Optimistic baseRev prevents clobbering an external edit. */
  async function pushDrafts(quiet) {
    if (!protoDraft || pushBusy || syncDeferred) return;
    pushBusy = true;
    var levels = JSON.parse(JSON.stringify(protoDraft));
    ['R','Z','A','M'].forEach(function (lv) {
      levels[lv] = (levels[lv] || []).map(function (x) {
        return { title: Object.assign({}, x.title), detail: Object.assign({}, x.detail) };
      });
    });
    try {
      var r = await fetch('api/protocols', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ baseRev: syncRev, levels: levels })
      });
      var res = await r.json();
      if (!res.ok) {
        if (res.conflict) {
          syncDeferred = true;
          syncStatus(t('m.proto.sync.conflict'), '');
          V.toast(t('m.proto.sync.conflict'), 'bad');
        } else {
          V.toast(t('m.proto.import.fail', { msg: res.error || '' }), 'bad');
        }
        return;
      }
      syncRev = res.rev;
      if (!quiet) syncStatus(t('m.proto.sync.pushed'), '');
    } catch (e) {
      syncStatus(t('m.proto.sync.off'), '');
    } finally {
      pushBusy = false;
    }
  }

  async function pollDrafts(force) {
    if (syncBusy || pushBusy || (!force && editingNow())) return;
    if (syncDeferred && !force) return;     // conflict needs a manual refresh
    var data;
    try { data = await fetchDrafts(); }
    catch (e) { syncStatus(t('m.proto.sync.off'), ''); return; }
    if (data.errors && data.errors.length) {
      syncStatus(t('m.proto.import.issues') + '：' + data.errors[0], '');
      return;
    }
    if (data.rev === syncRev) { syncDeferred = false; return; }
    syncBusy = true;
    try {
      await pullDrafts(data, false);
      render();
      syncStatus(t('m.proto.sync.on'), '');
    } catch (e) {
      V.toast(t('m.proto.import.fail', { msg: e.message || String(e) }), 'bad');
    } finally {
      syncBusy = false;
    }
  }

  async function initSync() {
    var data;
    try { data = await fetchDrafts(); }
    catch (e) { syncStatus(t('m.proto.sync.off'), ''); }
    if (!data) return;
    syncRev = data.rev;
    if (data.errors && data.errors.length) {
      syncStatus(t('m.proto.import.issues') + '：' + data.errors[0], '');
    } else {
      var defined = data.defined || [];
      if (defined.length) {
        syncBusy = true;
        try { await pullDrafts(data, true); render(); } catch (e) {}
        finally { syncBusy = false; }
      }
      syncStatus(t('m.proto.sync.on'), '');
    }
    setInterval(pollDrafts, 2000);
  }

  /* Manual refresh, also used to resolve a conflict. */
  async function refreshSync() {
    var data;
    try { data = await fetchDrafts(); }
    catch (e) { V.toast(t('m.proto.sync.off'), 'bad'); return; }
    if (data.errors && data.errors.length) {
      V.toast(t('m.proto.import.fail', { msg: data.errors.join('; ') }), 'bad');
      return;
    }
    syncRev = data.rev; syncDeferred = false;
    if (!await pullDrafts(data, true)) { V.toast(t('m.proto.import.empty'), 'bad'); return; }
    render();
    syncStatus(t('m.proto.sync.on'), '');
    V.toast(t('m.proto.sync.pulled'), 'good');
  }

  /* Debounced auto-save: every edit reaches both the sealed register and
     the TXT files without a manual click. */
  async function flushPush() {
    if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
    syncSuspend = true;
    var snapshot = JSON.parse(JSON.stringify(getProto(lastState)));
    try {
      await V.Vault.mutate(function (s) {
        ['R','Z','A','M'].forEach(function (lv) { s.protocol[lv] = snapshot[lv]; });
        V.Vault.ledger(s, 'AUTHORITY', 'm.proto.saved');
      });
      await pushDrafts(true);
      syncStatus(t('m.proto.sync.pushed'), '');
    } catch (e) {
      /* keep the in-memory draft; the next poll/save retries */
    } finally {
      syncSuspend = false;
    }
  }

  function schedulePush() {
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(function () { flushPush(); }, 700);
  }

  function importProtocols() { refreshSync(); }

  function paneProtocol(s) {
    var p = getProto(s);
    var h = '<div class="doc"><div class="doc-head"><div><div class="kicker">' + esc(t('g.securityShort')) + '</div><h2>' + esc(t('m.proto.title')) +
      '</h2><div class="sub">' + esc(t('m.proto.sub')) + '</div></div>' +
      '<div class="btn-row" style="margin:0"><button class="btn secondary sm" data-act="proto-import">' + esc(t('m.proto.sync.refresh')) +
      '</button><button class="btn gold sm" data-act="proto-save">' + esc(t('a.save')) + '</button></div></div><div class="doc-body">';
    h += '<div class="small muted mb">' + esc(t('m.proto.sync.hint')) + '</div>';
    h += '<div class="small muted mb" id="proto-sync">◈ ' + esc(t('m.proto.sync.checking')) + '</div>';
    h += '<div class="tabs">' + ['R','Z','A','M'].map(function (lv) {
      return '<button data-act="proto-level" data-lv="' + lv + '" class="' + (protoLevel === lv ? 'on' : '') + '">' +
        esc(t('i.level.' + lv)) + ' <span class="count">' + (p[lv] || []).length + '</span></button>';
    }).join('') + '</div>';
    h += '<div class="notice"><span class="ttl">' + esc(t('i.level.' + protoLevel)) + '</span>' + esc(t('i.level.' + protoLevel + '.desc')) + '</div>';
    h += '<div class="small muted mb">' + esc(t('m.proto.fallback')) + '</div>';
    var steps = p[protoLevel] || [];
    if (!steps.length) h += '<div class="empty"><span class="big">§</span>' + esc(t('m.proto.empty')) + '</div>';
    steps.forEach(function (st, i) {
      h += '<div class="step-edit" data-step="' + esc(st.id) + '"><div class="bar">' +

  /* ---------- credential issuance ---------- */
  function issueCredential(s, ref, stage) {
    var sub = s.subjects[ref];
    if (!sub) {
      sub = { ref: ref, createdAt: V.now(), identity: {}, credential: 'NONE', credentialCode: null,
        credentials: [], nationalId: null, retained: false, notes: '' };
      s.subjects[ref] = sub; s.counters.subject++;
    }
    var type = V.CREDENTIAL_FOR[stage];
    var c = V.code(type === 'CITIZEN' ? 'VDL-NID' : 'VDL-' + type);
    sub.credential = type; sub.credentialCode = c; sub.retained = true;
    sub.credentials.push({ type: type, code: c, at: V.now() });
    if (type === 'CITIZEN') sub.nationalId = c;
    if (stage === 'C' || stage === 'D' || stage === 'TR' || stage === 'PR') {
      s.certificates.push({
        code: c, ref: ref, kind: 'VISA', level: null, grade: null,
        issuedAt: V.now(), ts: V.tsRecord(V.now()), steps: V.instrumentSteps('VISA'),
        subject: subjectSnapshot(sub), status: 'VALID', purpose: stage, origin: 'AUTHORITY'
      });
      s.counters.cert++;
    }
    V.Vault.ledger(s, 'AUTHORITY', 'p.approved.body');
    return c;
  }
  function subjectSnapshot(sub) {
    var i = sub.identity || {};
    return {
      name: i.name || [i.surname, i.given].filter(Boolean).join(' ') || '—',
      dob: i.dob || '—', nationality: i.nationality || i.natCurrent || '—',
      passportNo: i.passportNo || '—', address: i.address || '—',
      credentialLabel: credentialLabel(sub.credential),
      credentialCode: sub.credentialCode, nationalId: sub.nationalId
    };
  }
  function credentialLabel(c) {
    return t(c === 'NONE' ? 'cr.none' : c === 'CITIZEN' ? 'cr.CITIZEN' : 'cr.' + c);
  }

  /* ---------- adjudication ---------- */
  function actionsFor(a) {
    var f = V.FLOW[a.stage]; if (!f) return [];
    return a.round === 2 ? (f.actions2 || []) : (f.actions1 || []);
  }
  var ACTION_KEY = { PREAPPROVE:'a.preapprove', APPROVE:'a.approve', REJECT:'a.reject', WAITLIST:'a.waitlist' };

  async function openAdjudication(appId) {
    var s = await V.Vault.state();
    var a = s.applications.find(function (x) { return x.id === appId; });
    if (!a) return;
    var env = V.Vault.inbox().find(function (e) { return e.id === a.inboxId; });
    var payload = null, decErr = '';
    if (env) {
      try { payload = await V.openForChancellery(env.payload); }
      catch (e) { decErr = String(e && e.message || e); }
    }
    var html = '<div class="small mono mb">' + esc(t('m.app.sealedNote')) + ' · ' + esc(a.id) + '</div>';
    html += '<div class="kv mb"><div class="k">' + esc(t('m.app.col.stage')) + '</div><div class="v">' + esc(t('st.' + a.stage + '.full')) + '</div>' +
      '<div class="k">' + esc(t('m.app.col.round')) + '</div><div class="v">' + a.round + '</div>' +
      '<div class="k">' + esc(t('g.subjectRef')) + '</div><div class="v mono">' + esc(a.ref) + '</div>' +
      '<div class="k">' + esc(t('m.app.col.state')) + '</div><div class="v">' + esc(appStatus(a.status)) + '</div></div>';
    if (decErr) html += '<div class="notice bad">' + esc(t('x.err')) + ' ' + esc(decErr) + '</div>';
    if (payload && payload.form) {
      var cells = Object.keys(payload.form).filter(function (k) { return k !== 'camera' && typeof payload.form[k] !== 'object'; });
      function fieldLabel(k) {
        var meta = V.FIELDS[k];
        return meta && meta.lk ? t(meta.lk) : t('f.' + k);
      }
      function fieldValue(v) {
        if (v === true) return t('a.yes');
        if (v === false) return t('a.no');
        if (typeof v === 'string' && /^o\./.test(v)) return t(v);
        return v || '—';
      }
      html += '<h4 style="margin:14px 0 8px;font-size:13px">' + esc(t('m.app.detail')) + '</h4><div class="app-detail"><div class="kv">' +
        cells.map(function (k) {
          return '<div class="k">' + esc(fieldLabel(k)) + '</div><div class="v">' + esc(fieldValue(payload.form[k])) + '</div>';
        }).join('') + '</div></div>';
    }
    if (payload && payload.biometrics && payload.biometrics.frames && payload.biometrics.frames.length) {
      html += '<h4 style="margin:14px 0 6px;font-size:13px">' + esc(t('m.app.biometrics')) + '</h4><div class="bio-strip">' +
        payload.biometrics.frames.map(function (f) { return '<img src="' + esc(f.data) + '" alt="live frame">'; }).join('') + '</div>' +
        '<div class="small mono muted mt">' + esc(payload.biometrics.attestation || '') + '</div>';
    }
    if (a.certRefs && a.certRefs.length) html += '<div class="small mt"><b>' + esc(t('m.app.certRefs')) + ':</b> ' + a.certRefs.map(esc).join(' · ') + '</div>';

    /* Full history for this subject */
    var hist = s.applications.filter(function (x) { return x.ref === a.ref; }).sort(function (x, y) { return x.lodgedAt - y.lodgedAt; });
    html += '<h4 style="margin:16px 0 8px;font-size:13px">' + esc(t('m.app.history')) + '</h4>' +
      '<div class="tbl-wrap"><table class="tbl compact"><thead><tr><th>' + esc(t('m.app.col.id')) + '</th><th>' + esc(t('m.app.col.stage')) +
      '</th><th>' + esc(t('m.app.col.round')) + '</th><th>' + esc(t('m.app.col.state')) + '</th><th>' + esc(t('m.app.col.lodged')) + '</th></tr></thead><tbody>' +
      hist.map(function (x) {
        return '<tr><td class="mono">' + esc(x.id) + '</td><td>' + esc(t('st.' + x.stage + '.name')) + '</td><td>' + x.round +
          '</td><td>' + esc(appStatus(x.status)) + '</td><td class="mono">' + esc(fmt(x.lodgedAt)) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    var insp = s.inspections.filter(function (x) { return x.ref === a.ref; });
    if (insp.length) html += '<div class="small mt"><b>' + esc(t('m.ov.inspections')) + ':</b> ' +
      insp.map(function (x) { return esc(t('i.level.' + x.level) + ' → ' + outcomeLabel(x.outcome)); }).join(' · ') + '</div>';

    if (a.status === 'LODGED') {
      html += '<div class="reason-box"><label>' + esc(t('a.reason')) + ' · ' + esc(t('m.app.reasonReq')) + '</label>' +
        '<textarea data-reason="' + esc(a.id) + '" placeholder="' + esc(t('m.app.reasonPh')) + '"></textarea></div>' +
        '<div class="small strong" style="margin-top:12px">' + esc(t('m.app.actionsFor')) + '</div>' +
        '<div class="decision-bar">' + actionsFor(a).map(function (ac) {
          return '<button class="btn ' + (ac === 'REJECT' ? 'danger' : ac === 'APPROVE' ? '' : 'gold') +
            '" data-act="decide" data-id="' + esc(a.id) + '" data-d="' + ac + '">' + esc(t(ACTION_KEY[ac])) + '</button>';
        }).join('') + '</div>';
    }
    V.modal(t('m.app.detail'), html, [{ label: t('a.close'), cls: 'secondary' }]);
  }

  async function decide(appId, action) {
    var reasonEl = document.querySelector('[data-reason="' + appId + '"]');
    var reason = reasonEl ? String(reasonEl.value || '').trim() : '';
    if (action === 'REJECT' && !reason) { V.toast(t('m.app.reasonReq'), 'bad'); return; }
    var s = await V.Vault.mutate(function (s) {
      var a = s.applications.find(function (x) { return x.id === appId; });
      if (!a || a.status !== 'LODGED') return false;
      /* Statuses are adjectives, not action verbs: the route state machine
         in core.js tests for 'APPROVED' when opening the oath ceremony. */
      a.status = action === 'PREAPPROVE' ? 'PREAPPROVED'
               : action === 'WAITLIST'   ? 'WAITLISTED'
               : action === 'APPROVE'    ? 'APPROVED'
               : action === 'REJECT'     ? 'REJECTED' : action;
      a.reason = reason || null; a.decidedAt = V.now();
      s.decisions.push({ id: V.uid('DEC'), appId: a.id, ref: a.ref, action: action, reason: reason, at: V.now() });
      var sub = s.subjects[a.ref];
      var snap = sub ? subjectSnapshot(sub) : {};

      if (action === 'APPROVE') {
        if (a.stage === 'NAT') {
          /* Approval of the final naturalisation petition summons the oath. */
          s.oaths.push({ id: V.uid('OATH'), ref: a.ref, at: V.now(), status: 'SUMMONED', confirmedAt: null });
          V.Vault.notice(s, a.ref, 'OATH_SUMMONED', {});
          V.Vault.ledger(s, 'AUTHORITY', 's.awaitingOath');
        } else {
          var c = issueCredential(s, a.ref, a.stage);
          V.Vault.notice(s, a.ref, 'APPROVED', { stage: a.stage, code: c });
          V.Vault.ledger(s, 'AUTHORITY', 'p.approved.title');
        }
      } else if (action === 'PREAPPROVE') {
        var lv = V.INSPECTION_FOR[a.stage];
        V.Vault.addPending(s, a.ref, lv, a.stage);
        V.Vault.notice(s, a.ref, 'PREAPPROVED', { stage: a.stage, level: lv });
        V.Vault.ledger(s, 'AUTHORITY', 'p.preact.title');
      } else if (action === 'WAITLIST') {
        V.Vault.addPending(s, a.ref, 'M', 'NAT');
        V.Vault.notice(s, a.ref, 'WAITLISTED', {});
        V.Vault.ledger(s, 'AUTHORITY', 'p.waitlist.title');
      } else {
        V.Vault.notice(s, a.ref, 'REJECTED', { stage: a.stage, reason: reason });
        V.Vault.ledger(s, 'AUTHORITY', 'p.reject.title');
      }
    });
    V.closeModal();
    V.toast(t('m.app.decisionRecorded'), 'good');
    render();
    /* Oath summons need no further action here; the portal performs the ceremony. */
  }

  /* ---------- grading / oath confirmation ---------- */
  async function gradeM(code, g) {
    await V.Vault.mutate(function (s) {
      var c = s.certificates.find(function (x) { return x.code === code; });
      if (!c || c.status !== 'AWAITING_GRADE') return false;
      c.grade = g; c.status = 'VALID';
      s.inspections.forEach(function (i) { if (i.certCode === code) i.grade = g; });
      V.Vault.notice(s, c.ref, 'M_GRADED', { code: code, grade: g });
      V.Vault.ledger(s, 'AUTHORITY', g === 'EXCELLENT' ? 'o.grade.excellent' : g === 'PASS' ? 'o.grade.pass' : 'o.grade.fail');
    });
    V.toast(t('m.insp.graded'), 'good'); render();
  }
  async function confirmOath(ref) {
    await V.Vault.mutate(function (s) {
      var o = s.oaths.filter(function (x) { return x.ref === ref; }).pop();
      if (!o || o.status === 'CONFIRMED') return false;
      o.status = 'CONFIRMED'; o.confirmedAt = V.now();
      var c = issueCredential(s, ref, 'NAT');
      V.Vault.notice(s, ref, 'CITIZEN_CONFIRMED', { code: c });
      V.Vault.ledger(s, 'AUTHORITY', 'p.citizen.title');
    });
    V.toast(t('p.citizen.title'), 'good'); render();
  }

  /* ---------- subject CRUD ---------- */
  function subjectForm(sub) {
    sub = sub || { identity: {}, credential: 'NONE' };
    var i = sub.identity || {};
    var f = [
      ['surname','text',i.surname],['given','text',i.given],['dob','date',i.dob],
      ['natCurrent','text',i.natCurrent || i.nationality],['passportNo','text',i.passportNo],
      ['email','text',i.email],['phone','text',i.phone],['address','text',i.address]
    ];
    var h = '<div class="fields">' + f.map(function (x) {
      return '<div class="field"><label>' + esc(t('f.' + x[0])) +
        '</label><input data-sf="' + x[0] + '" type="' + x[1] + '" value="' + esc(x[2] || '') + '"></div>';
    }).join('') + '</div>';
    h += '<div class="fields mt"><div class="field"><label>' + esc(t('m.sub.col.status')) + '</label><select data-sf="credential">' +
      ['NONE','C','D','TR','PR','CITIZEN'].map(function (c) {
        return '<option value="' + c + '"' + (sub.credential === c ? ' selected' : '') + '>' + esc(t(c === 'NONE' ? 'cr.none' : c === 'CITIZEN' ? 'cr.CITIZEN' : 'cr.' + c)) + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field"><label>' + esc(t('cr.code')) + '</label><input data-sf="credentialCode" value="' + esc(sub.credentialCode || '') + '"></div>' +
      '<div class="field"><label>' + esc(t('g.nationalId')) + '</label><input data-sf="nationalId" value="' + esc(sub.nationalId || '') + '"></div></div>' +
      '<div class="field mt"><label>' + esc(t('m.sub.col.ref')) + '</label><input data-sf="ref" value="' + esc(sub.ref || '') + '" ' + (sub.ref ? 'readonly' : '') + '></div>';
    return h;
  }
  function openSubject(sub) {
    V.modal(sub ? t('m.sub.edit') : t('m.sub.create'), subjectForm(sub), [
      { label: t('a.cancel'), cls: 'secondary' },
      { label: t('a.save'), cls: 'gold', onClick: function () { saveSubject(sub ? sub.ref : null); } }
    ]);
  }
  async function saveSubject(ref) {
    var vals = {};
    document.querySelectorAll('[data-sf]').forEach(function (el) { vals[el.getAttribute('data-sf')] = el.value; });
    await V.Vault.mutate(function (s) {
      var key = ref || vals.ref || V.code('VDL-SUB');
      var sub = s.subjects[key];
      if (!sub) {
        sub = { ref: key, createdAt: V.now(), identity: {}, credential: 'NONE',
          credentialCode: null, credentials: [], nationalId: null, retained: true, notes: '' };
        s.subjects[key] = sub; s.counters.subject++;
      }
      ['surname','given','dob','natCurrent','passportNo','email','phone','address','nationality'].forEach(function (k) {
        if (vals[k] !== undefined) sub.identity[k] = vals[k];
      });
      sub.identity.name = [sub.identity.surname, sub.identity.given].filter(Boolean).join(' ') || sub.identity.name;
      sub.credential = vals.credential || sub.credential;
      sub.credentialCode = vals.credentialCode || sub.credentialCode;
      sub.nationalId = vals.nationalId || sub.nationalId;
      V.Vault.ledger(s, 'AUTHORITY', ref ? 'm.sub.edit' : 'm.sub.create');
    });
    V.toast(t('x.saved'), 'good'); render();
  }

  /* ---------- event delegation ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-tab],[data-act]');
    if (!el) return;
    if (el.dataset.tab) { active = el.dataset.tab; render(); return; }
    var act = el.dataset.act, id = el.dataset.id;
    switch (act) {
      case 'adj': openAdjudication(id); break;
      case 'decide': decide(id, el.dataset.d); break;
      case 'grade': gradeM(el.dataset.code, el.dataset.g); break;
      case 'cert-dl': {
        V.Vault.state().then(function (s) {
          var c = s.certificates.find(function (x) { return x.code === el.dataset.code; });
          if (c) V.downloadCertificate(V.certSpecFromRecord(c)).then(function () { V.toast(t('i.certReady'), 'good'); });
        });
        break;
      }
      case 'sub-create': openSubject(null); break;
      case 'sub-edit': V.Vault.state().then(function (s) { openSubject(s.subjects[id]); }); break;
      case 'sub-del': V.confirmDialog(t('a.delete'), esc(t('m.sub.deleteAsk')), async function () {
        await V.Vault.mutate(function (s) {
          delete s.subjects[id];
          s.applications = s.applications.filter(function (a) { return a.ref !== id; });
          s.leaps = s.leaps.filter(function (a) { return a.ref !== id; });
          s.inspections = s.inspections.filter(function (a) { return a.ref !== id; });
          s.certificates = s.certificates.filter(function (a) { return a.ref !== id; });
          delete s.notices[id]; delete s.pending[id];
          V.Vault.ledger(s, 'AUTHORITY', 'm.sub.deleteAsk');
        });
        render();
      }); break;
      case 'proto-level': protoLevel = el.dataset.lv; render(); break;
      case 'proto-lang': protoLang = el.dataset.lg; render(); break;
      case 'proto-add': {
        var p = getProto(lastState);
        p[protoLevel].push({ id: V.uid('STP'), title: {}, detail: {} });
        render(); schedulePush(); break;
      }
      case 'proto-del': { getProto(lastState)[protoLevel].splice(+el.dataset.i, 1); render(); schedulePush(); break; }
      case 'proto-up': case 'proto-down': {
        var arr = getProto(lastState)[protoLevel], i = +el.dataset.i, j = act === 'proto-up' ? i - 1 : i + 1;
        if (j >= 0 && j < arr.length) { var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp; }
        render(); schedulePush(); break;
      }
      case 'proto-import': importProtocols(); break;
      case 'proto-save': {
        var snapshot = JSON.parse(JSON.stringify(getProto(lastState)));
        V.Vault.mutate(function (s) {
          ['R','Z','A','M'].forEach(function (lv) { s.protocol[lv] = snapshot[lv]; });
          V.Vault.ledger(s, 'AUTHORITY', 'm.proto.saved');
        }).then(function () {
          pushDrafts(true);
          V.toast(t('m.proto.saved'), 'good'); render();
        });
        break;
      }
      case 'leap-direct': {
        var lv2 = el.dataset.lv;
        V.Vault.mutate(function (s) {
          var lp = s.leaps.find(function (x) { return x.id === id; });
          if (!lp || lp.status !== 'LODGED') return false;
          lp.directedLevel = lv2; lp.directedAt = V.now();
          V.Vault.addPending(s, lp.ref, lv2, 'LEAP');
          V.Vault.notice(s, lp.ref, 'LEAP_INSPECTION', { level: lv2, id: lp.id });
          V.Vault.ledger(s, 'AUTHORITY', 'm.leap.directed');
        }).then(function () { V.toast(t('m.leap.directed'), 'good'); render(); });
        break;
      }
      case 'leap-decide': {
        var d = el.dataset.d;
        var ri = document.querySelector('[data-leap-reason="' + id + '"]');
        var rr = ri ? String(ri.value || '').trim() : '';
        if (d === 'REJECT' && !rr) { V.toast(t('m.app.reasonReq'), 'bad'); return; }
        V.Vault.mutate(function (s) {
          var lp = s.leaps.find(function (x) { return x.id === id; });
          if (!lp || lp.status !== 'LODGED') return false;
          lp.status = d === 'APPROVE' ? 'APPROVED' : d === 'REJECT' ? 'REJECTED' : d;
          lp.reason = rr || null; lp.decidedAt = V.now();
          V.Vault.clearPending(s, lp.ref, lp.directedLevel, 'LEAP');
          V.Vault.notice(s, lp.ref, 'LEAP_DECISION', { action: d, reason: rr });
          V.Vault.ledger(s, 'AUTHORITY', d === 'APPROVE' ? 'm.leap.granted' : 'p.reject.title');
        }).then(function () { V.toast(t('m.app.decisionRecorded'), 'good'); render(); });
        break;
      }
      case 'oath-confirm': confirmOath(id); break;
      case 'sys-export': {
        V.Vault.export().then(function (txt) {
          var blob = new Blob([txt], { type: 'application/json' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'VDL-SEALED-REGISTER-' + V.now() + '.json';
          document.body.appendChild(a); a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
        });
        break;
      }
      case 'sys-import': {
        var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
        inp.onchange = function () {
          var f = inp.files[0]; if (!f) return;
          var r = new FileReader();
          r.onload = function () {
            V.Vault.import(String(r.result)).then(function () { V.toast(t('x.saved'), 'good'); protoDraft = null; render(); })
              .catch(function (err) { V.toast(t('x.err') + ' ' + err.message, 'bad'); });
          };
          r.readAsText(f);
        };
        inp.click(); break;
      }
      case 'sys-purge': V.confirmDialog(t('a.reset'), esc(t('m.sys.purgeAsk')), function () {
        V.Vault.reset(); protoDraft = null; V.toast(t('m.sys.purged'), 'good'); render();
      }); break;
    }
  });

  /* Protocol editor: keep the in-memory draft current without re-rendering,
     then auto-save to the sealed register and the TXT files. */
  document.addEventListener('input', function (e) {
    var k = e.target.dataset && e.target.dataset.pfield;
    if (!k || !protoDraft) return;
    var parts = k.split('|');
    var st = protoDraft[protoLevel].find(function (x) { return x.id === parts[0]; });
    if (st) { st[parts[2]][parts[1]] = e.target.value; schedulePush(); }
  });
  /* Apply any external TXT change that arrived while a caret was active. */
  document.addEventListener('focusout', function (e) {
    if (!(e.target && e.target.dataset && e.target.dataset.pfield)) return;
    if (syncDeferred) return;
    /* Flush a pending auto-save first, otherwise an external change polled
       right after blur could overwrite keystrokes that never reached disk. */
    if (pushTimer) {
      flushPush().then(function () { setTimeout(pollDrafts, 60); });
    } else {
      setTimeout(pollDrafts, 60);
    }
  });

  /* Oath confirmation appears in the Inspections pane when a summons is taken. */
  var _origPaneInspections = paneInspections;
  paneInspections = function (s) {
    var h = _origPaneInspections(s);
    var pendingOaths = s.oaths.filter(function (o) { return o.status === 'TAKEN'; });
    if (pendingOaths.length) {
      var extra = '<div class="doc"><div class="doc-head"><div><div class="kicker">' + esc(t('p.oath.title')) +
        '</div><h3>' + esc(t('p.oath.title')) + '</h3></div></div><div class="doc-body">';
      pendingOaths.forEach(function (o) {
        extra += '<div class="stage-card" style="min-height:0;margin-bottom:10px"><div class="top"><span class="code mono">' +
          esc(o.ref) + '</span><span class="badge pending">' + esc(t('s.oathDone')) + '</span></div>' +
          '<div class="small">' + esc(t('p.oath.pending')) + '</div>' +
          '<div class="btn-row"><button class="btn sm gold" data-act="oath-confirm" data-id="' + esc(o.ref) + '">' + esc(t('a.confirmOath')) + '</button></div></div>';
      });
      extra += '</div></div>';
      return extra + h;
    }
    return h;
  };

  render();
  initSync();
})();
</script>
</body>
</html>
