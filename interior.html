<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grand Duchy of Vidland · Interior Security Inspectorate</title>
<link rel="icon" type="image/svg+xml" href="icons/interior.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/interior-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/interior-180.png">
<link rel="manifest" href="icons/manifest-interior.json">
<meta name="theme-color" content="#0a1b2e">
<meta name="apple-mobile-web-app-title" content="境内安检">
<meta name="application-name" content="境内安检">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="vidland.css">
<script src="vidland-store.js"></script>
<script src="vidland-i18n.js"></script>
<script src="vidland-core.js"></script>
<style>
  .level-note{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line)}
  @media(max-width:820px){.level-note{grid-template-columns:1fr}}
  .level-note .cell{border-right:1px solid var(--line);background:var(--paper)}
  .level-note .cell:last-child{border-right:0}
  .level-note .k{background:var(--navy);color:#f0e8d5;padding:10px 14px;font-family:var(--serif);font-size:14px;letter-spacing:.02em}
  .level-note .v{padding:11px 14px;font-size:11.5px;line-height:1.7;color:var(--slate);min-height:96px}
</style>
</head>
<body>
<div id="masthead"></div>
<div id="subbar"></div>
<div class="wrap">
  <div class="hero">
    <div class="eyebrow" id="h-eyebrow"></div>
    <h1 id="h-title"></h1>
    <div class="lead" id="h-lead"></div>
    <div class="small" style="margin-top:12px;color:var(--gold);font-weight:600">◈ <span id="h-secure"></span></div>
    <div class="watermark">VIDLAND</div>
  </div>

  <div class="doc">
    <div class="doc-head"><div><div class="kicker" id="lv-kicker"></div><h2 id="lv-title"></h2>
      <div class="sub" id="lv-sub"></div></div></div>
    <div class="doc-body">
      <div class="level-note" id="lv-grid"></div>
      <div class="notice mt"><span class="ttl" id="lv-note-ttl"></span><span id="lv-note"></span></div>
    </div>
    <div class="doc-foot"><span id="lv-foot"></span><span class="docnum">Z / A / M</span></div>
  </div>

  <div id="runner"></div>

  <div class="doc">
    <div class="doc-head"><div><div class="kicker" id="ch-kicker"></div><h3 id="ch-title"></h3></div></div>
    <div class="doc-body"><div class="small" id="ch-body"></div></div>
    <div class="doc-foot"><span id="ch-foot"></span><span class="docnum" id="ch-num"></span></div>
  </div>
</div>
<div id="footer"></div>

<script>
(function () {
  'use strict';
  var V = window.Vidland, t = V.t, esc = V.esc;
  var LEVELS = ['Z', 'A', 'M'];

  function paintStatic() {
    document.getElementById('h-eyebrow').textContent = t('g.stateShort') + ' · ' + t('g.official');
    document.getElementById('h-title').textContent = t('g.interior');
    document.getElementById('h-lead').textContent = t('i.verify.subInt');
    document.getElementById('h-secure').textContent = t('g.secure');
    document.getElementById('lv-kicker').textContent = t('g.securityShort');
    document.getElementById('lv-title').textContent = t('i.selectLevel');
    document.getElementById('lv-sub').textContent = t('g.restricted');
    document.getElementById('lv-grid').innerHTML = LEVELS.map(function (lv) {
      return '<div class="cell"><div class="k">' + esc(t('i.level.' + lv)) + '</div>' +
        '<div class="v">' + esc(t('i.level.' + lv + '.desc')) + '</div></div>';
    }).join('');
    document.getElementById('lv-note-ttl').textContent = t('m.proto.title');
    document.getElementById('lv-note').textContent = t('m.proto.sub');
    document.getElementById('lv-foot').textContent = t('g.secure');
    document.getElementById('ch-kicker').textContent = t('g.chancelleryShort');
    document.getElementById('ch-title').textContent = t('g.secure');
    document.getElementById('ch-body').textContent = t('p.status.hint');
    document.getElementById('ch-foot').textContent = t('x.sealed');
    document.getElementById('ch-num').textContent = t('x.port');
  }

  V.init('interior', paintStatic);
  paintStatic();
  V.mountInspectionRunner(document.getElementById('runner'),
    { page: 'INTERIOR', levels: LEVELS, verifyTitleKey: 'i.verify.subInt' });
})();
</script>
</body>
</html>
